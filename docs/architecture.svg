<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Arquitectura Serverless Lambda y Amazon RDS PostgreSQL en AWS">
  <defs>
    <style>
      .diag-bg { fill: #111720; }
      .diag-zone { fill: rgba(148, 163, 184, 0.03); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.1; stroke-dasharray: 4 3; }
      .diag-zone-inner { fill: rgba(148, 163, 184, 0.02); stroke: rgba(148, 163, 184, 0.20); stroke-width: 1; stroke-dasharray: 3 3; }
      .diag-zone-label { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 9px; font-weight: 600; }
      .diag-box { fill: #17202c; stroke: rgba(148, 163, 184, 0.35); stroke-width: 1.3; }
      .diag-box-accent { fill: rgba(91, 164, 245, 0.12); stroke: #5ba4f5; stroke-width: 1.3; }
      .diag-box-ok { fill: rgba(52, 211, 153, 0.10); stroke: #34d399; stroke-width: 1.3; }
      .diag-label { fill: #f0f6fc; font-family: 'Fira Code', Consolas, monospace; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .diag-sub { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8.5px; text-anchor: middle; }
      .diag-edge { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8px; }
      .diag-line { fill: none; stroke: #94a3b8; stroke-width: 1.25; }
      .diag-line-dashed { fill: none; stroke: #5ba4f5; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .diag-arrow { fill: #94a3b8; }
      .diag-arrow-accent { fill: #5ba4f5; }
    </style>
    <marker id="arr-rds" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
    <marker id="arr-rds-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow-accent" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="diag-bg" x="0" y="0" width="640" height="360" rx="8" />

  <!-- Cliente externo -->
  <rect class="diag-box" x="16" y="154" width="90" height="52" rx="6" />
  <text class="diag-label" x="61" y="177">Cliente</text>
  <text class="diag-sub" x="61" y="192">HTTPS / REST</text>

  <!-- Frontera AWS Cloud -->
  <rect class="diag-zone" x="126" y="16" width="498" height="328" rx="8" />
  <text class="diag-zone-label" x="138" y="33">AWS Cloud (us-west-2 · Entorno IAM Acotado)</text>

  <!-- Subzona Build Efimero -->
  <rect class="diag-zone-inner" x="140" y="46" width="206" height="80" rx="6" />
  <text class="diag-zone-label" x="148" y="60">Build Efímero (destruido post-deploy)</text>

  <rect class="diag-box" x="152" y="68" width="182" height="48" rx="6" />
  <text class="diag-label" x="243" y="89">EC2 Amazon Linux</text>
  <text class="diag-sub" x="243" y="104">Py 3.11 · psycopg2 · AWS CLI</text>

  <!-- Computo Serverless -->
  <rect class="diag-box-accent" x="152" y="154" width="182" height="52" rx="6" />
  <text class="diag-label" x="243" y="177">AWS Lambda</text>
  <text class="diag-sub" x="243" y="192">Py 3.11 · Function URL</text>

  <!-- Configuracion e IAM -->
  <rect class="diag-box-ok" x="152" y="248" width="182" height="52" rx="6" />
  <text class="diag-label" x="243" y="271">IAM &amp; Env Vars</text>
  <text class="diag-sub" x="243" y="286">DB_HOST · DB_NAME · DB_PASS</text>

  <!-- Subzona Amazon VPC -->
  <rect class="diag-zone-inner" x="364" y="46" width="248" height="282" rx="6" />
  <text class="diag-zone-label" x="374" y="60">Amazon VPC (Capa de Datos)</text>

  <rect class="diag-box-ok" x="378" y="96" width="220" height="50" rx="6" />
  <text class="diag-label" x="488" y="118">Security Group</text>
  <text class="diag-sub" x="488" y="133">Inbound TCP 5432 (PostgreSQL)</text>

  <rect class="diag-box-accent" x="378" y="198" width="220" height="54" rx="6" />
  <text class="diag-label" x="488" y="221">Amazon RDS PostgreSQL</text>
  <text class="diag-sub" x="488" y="236">db.t3.micro · Single-AZ</text>

  <!-- Flechas principales -->
  <line class="diag-line" x1="106" y1="180" x2="148" y2="180" marker-end="url(#arr-rds)" />
  <text class="diag-edge" x="111" y="173">HTTPS</text>

  <path class="diag-line" d="M 334 180 L 352 180 L 352 121 L 374 121" marker-end="url(#arr-rds)" />
  <text class="diag-edge" x="338" y="172">SQL</text>

  <line class="diag-line" x1="488" y1="146" x2="488" y2="194" marker-end="url(#arr-rds)" />
  <text class="diag-edge" x="495" y="174">TCP 5432</text>

  <!-- Flechas secundarias / despliegue -->
  <line class="diag-line-dashed" x1="243" y1="116" x2="243" y2="150" marker-end="url(#arr-rds-acc)" />
  <text class="diag-edge" x="250" y="138">update-code</text>

  <line class="diag-line-dashed" x1="243" y1="248" x2="243" y2="210" marker-end="url(#arr-rds-acc)" />
  <text class="diag-edge" x="250" y="233">Env Vars</text>
</svg>
